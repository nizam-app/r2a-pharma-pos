[package]
name = "r2a_desktop"
version = "0.1.0"
description = "PharmaSync POS desktop (Tauri)"
authors = ["R2A"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "r2a_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
